name: Update Google Scholar data

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Scholar data
        run: python scripts/update_all.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml data/publications.json
          if git diff --staged --quiet; then
            echo "No Scholar data changes to commit."
          else
            git commit -m "$(cat <<'EOF'
chore: update Google Scholar citations and publications

Automated update from the weekly Scholar workflow.
EOF
)"
            git push
          fi
