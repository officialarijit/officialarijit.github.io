title: Arijit Nandi
email: arijit4ai@gmail.com
description: >-
  Advanced Machine Learning Researcher specializing in Federated Learning,
  Explainable AI, and Large Language Models.
url: "https://officialarijit.github.io"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /blog/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - requirements.txt
  - citation.txt
  - data/
  - scripts/
  - vendor/
  - .github/
  - .gitignore
  - .venv/
  - "*.mmd"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Arijit Nandi
      mathjax: true
